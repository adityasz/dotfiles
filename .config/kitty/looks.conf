font_family                  JetBrains Mono
font_size                    14.0
disable_ligatures            never
text_composition_strategy    1.7 30
cursor_trail                 1
cursor_trail_start_threshold 120
url_style                    dotted

tab_bar_edge                 top
tab_bar_align                left
tab_bar_style                custom
tab_separator                "  |  "
tab_activity_symbol          •
tab_bar_margin_height        3.0 1.0
tab_bar_margin_width         0.0
tab_title_max_length         60
window_border_width          2pt
window_margin_width          2
window_border_radius         8

foreground                   #000000
background                   #ffffff
wayland_titlebar_color       #ffffff
active_border_color          #dddddd
inactive_border_color        #fafafa
tab_bar_background           #ffffff
active_tab_foreground        #000000
active_tab_background        #dddddd
inactive_tab_foreground      #888888
inactive_tab_background      #ffffff
