XDG_DATA_HOME="$HOME/.local/share"
XDG_CONFIG_HOME="$HOME/.config"
XDG_STATE_HOME="$HOME/.local/state"
XDG_CACHE_HOME="$HOME/.cache"

# Vulkan does something that leads to D3cold->D0 transitions on NVIDIA GPUs.
# This line needs to be commented when using NVIDIA GPU for display.
VK_LOADER_DRIVERS_DISABLE="nvidia_icd.json"

MKLROOT="/opt/intel/oneapi/mkl/latest/"
SSH_AUTH_SOCK="$XDG_RUNTIME_DIR/ssh-agent.socket"
UV_LINK_MODE="symlink"
XCURSOR_PATH="/usr/share/icons:$XDG_DATA_HOME/icons"
_JAVA_OPTIONS="-Djava.util.prefs.userRoot=$XDG_CONFIG_HOME/java -Djavafx.cachedir=$XDG_CACHE_HOME/openjfx"

# Handle applications that do not follow the XDG base directory spec
ANDROID_USER_HOME="$XDG_DATA_HOME/android"
ASYMPTOTE_HOME="$XDG_DATA_HOME/asymptote"
BUN_INSTALL="$XDG_DATA_HOME/bun"
BUN_INSTALL_BIN="$XDG_DATA_HOME/bun/bin"
CARGO_HOME="$XDG_DATA_HOME/cargo"
CODEX_HOME="$XDG_DATA_HOME/codex"
CUDA_CACHE_PATH="$XDG_CACHE_HOME/nv"
DOTNET_CLI_HOME="$XDG_DATA_HOME/dotnet"
ELAN_HOME="$XDG_DATA_HOME/elan"
GDBHISTFILE="$XDG_STATE_HOME/gdb/history"
GEF_RC="$XDG_CONFIG_HOME/gef/gef.rc"
GHCUP_USE_XDG_DIRS=1
GNUPGHOME="$XDG_DATA_HOME/gnupg"
GOPATH="$XDG_DATA_HOME/go"
GRADLE_USER_HOME="$XDG_DATA_HOME/gradle"
INPUTRC="$XDG_CONFIG_HOME/readline/inputrc"
JUPYTER_CONFIG_DIR="$XDG_CONFIG_HOME/jupyter"
JUPYTER_RUNTIME_DIR="$XDG_RUNTIME_DIR/jupyter"
MAMBA_ROOT_PREFIX="$XDG_CACHE_HOME/mamba"
MATHEMATICA_USERBASE="$XDG_CONFIG_HOME/mathematica"
NODE_COMPILE_CACHE="$XDG_CACHE_HOME/node/compile_cache"
NODE_REPL_HISTORY="$XDG_STATE_HOME/node/repl_history"
NPM_CONFIG_USERCONFIG="$XDG_CONFIG_HOME/npm/npmrc"
PASSWORD_STORE_DIR="$XDG_DATA_HOME/pass"
PIXI_HOME="$XDG_DATA_HOME/pixi"
PSQL_HISTORY="$XDG_STATE_HOME/psql/history"
PYTHON_HISTORY="$XDG_STATE_HOME/python/history"
RUFF_CACHE_DIR="$XDG_CACHE_HOME/ruff"
RUSTUP_HOME="$XDG_DATA_HOME/rustup"
SQLITE_HISTORY="$XDG_STATE_HOME/sqlite/history"
TRITON_HOME="$XDG_CACHE_HOME/triton"
WINEPREFIX="$XDG_DATA_HOME/wine"
ZDOTDIR="$XDG_CONFIG_HOME/zsh"
